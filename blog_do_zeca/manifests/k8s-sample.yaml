apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-do-zeca
  labels:
    app: blog-do-zeca
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog-do-zeca
  template:
    metadata:
      labels:
        app: blog-do-zeca
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: blog-do-zeca-service
spec:
  type: NodePort
  selector:
    app: blog-do-zeca
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
